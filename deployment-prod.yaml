apiVersion: apps/v1
kind: Deployment
metadata:
  name: minterjt-lab34-prod
spec:
  replicas: 1  # Number of NGINX pods to run
  selector:
    matchLabels:
      app: minterjt-lab34-prod
  template:
    metadata:
      labels:
        app: minterjt-lab34-prod
    spec:
      containers:
      - name: nginx
        image: cithit/minterjt:latest                              #<-------change this to match your MiamiID.
        ports:
        - containerPort: 80  # Expose NGINX on port 80      
---
apiVersion: v1
kind: Service
metadata:
  name: minterjt-prod-service
spec:
  type: LoadBalancer 
  loadBalancerIP: PRODUCTION_IP                                     # <-----change this to match your load balancer IP!!!!
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: minterjt-lab34-prod 
