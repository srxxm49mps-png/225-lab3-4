apiVersion: apps/v1
kind: Deployment
metadata:
  name: minterjt-lab34-dev
spec:
  replicas: 1  # Number of NGINX pods to run
  selector:
    matchLabels:
      app: minterjt-lab34-dev
  template:
    metadata:
      labels:
        app: minterjt-lab34-dev
    spec:
      containers:
      - name: minterjt-lab34-dev-ingress
        image: cithit/minterjt:latest   #<-------change this to match your MiamiID.
        ports:
        - containerPort: 80  # Expose NGINX on port 80      
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
spec:
  rules: 
  - host: 
    http:
      paths:
      - path: /lab3-4(/|$)(.*)
        pathType: ImplementationSpecific
        backend: 
          service:
            name: minterjt-lab34-dev-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: minterjt-lab34-dev-service
spec:
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: minterjt-lab34-dev 
