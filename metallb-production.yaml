# Only the existing IP of the user's single-node cluster is configured.
# Production uses port 8080; ingress continues serving DEV on port 80.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: minterjt-production
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
  - 10.48.229.166/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: minterjt-production
  namespace: metallb-system
spec:
  ipAddressPools:
  - minterjt-production
  nodeSelectors:
  - matchLabels:
      kubernetes.io/hostname: minterjt-fl26-pool1-sfjhj-t2bf2
